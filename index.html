<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KLEIN</title>
<style>
:root{--bg:#f6f5f2;--cd:#fff;--t:#1d1d1f;--m:#6e6e73;--l:#e6e4df;--a:#1f3d36;--ab:#fff;--g:#2e8b57;--w:#c77d0a;--r:#c0392b;--b:#2f6fb5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--cd:#1e1e1c;--t:#f2f1ee;--m:#9a9a95;--l:#2e2e2b;--a:#8fc7b5;--ab:#111}}
:root[data-theme="dark"]{--bg:#141413;--cd:#1e1e1c;--t:#f2f1ee;--m:#9a9a95;--l:#2e2e2b;--a:#8fc7b5;--ab:#111}
html,body{margin:0;background:var(--bg);color:var(--t);font:14px/1.45 -apple-system,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}button,input,select{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}aside{width:210px;padding:20px 12px;border-right:1px solid var(--l);position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0}
.logo{font-weight:700;letter-spacing:.18em;font-size:16px;padding:0 10px 4px}.sub{color:var(--m);font-size:11px;padding:0 10px 16px}
.nv{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--m)}.nv:hover{background:var(--l)}.nv.on{background:var(--l);color:var(--t);font-weight:600}
main{flex:1;min-width:0;padding:22px 28px 60px;max-width:1100px;animation:in .25s}@keyframes in{from{opacity:0;transform:translateY(6px)}}
.top{display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap}.top input,.top select{padding:8px 12px;border:1px solid var(--l);background:var(--cd);border-radius:10px}.top input{flex:1;min-width:140px}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.02em}h2{font-size:13px;margin:26px 0 8px;color:var(--m);text-transform:uppercase;letter-spacing:.06em}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.g2{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.c{background:var(--cd);border:1px solid var(--l);border-radius:12px;padding:14px}.k{font-size:26px;font-weight:600;letter-spacing:-.02em}.ml{color:var(--m);font-size:12px}
.row{display:flex;gap:10px;align-items:center;padding:11px 14px;background:var(--cd);border:1px solid var(--l);border-radius:12px;margin-bottom:6px;flex-wrap:wrap}.row.ck{cursor:pointer}.row.ck:hover{border-color:var(--m)}.row>.f{flex:1;min-width:140px}
.bd{font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--l);color:var(--m);white-space:nowrap}.bd.g{background:#2e8b5722;color:var(--g)}.bd.w{background:#c77d0a22;color:var(--w)}.bd.r{background:#c0392b22;color:var(--r)}.bd.b{background:#2f6fb522;color:var(--b)}
.btn{border:1px solid var(--l);background:var(--cd);border-radius:9px;padding:6px 12px;cursor:pointer}.btn:active{transform:scale(.97)}.btn.p{background:var(--a);color:var(--ab);border-color:var(--a)}.btn.d{color:var(--r)}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tabs .btn.on{background:var(--t);color:var(--bg)}
#mo{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}#mo.s{display:flex}.md{background:var(--cd);border-radius:16px;padding:20px;width:100%;max-width:460px;max-height:90vh;overflow:auto;animation:in .2s}
.md label{display:block;font-size:12px;color:var(--m);margin:10px 0 3px}.md input,.md select{width:100%;padding:8px 10px;border:1px solid var(--l);border-radius:8px;background:var(--bg)}.er{color:var(--r);font-size:12px;margin-top:8px}
#ts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--t);color:var(--bg);padding:10px 18px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:10}#ts.s{opacity:1}
.bub{background:var(--l);border-radius:12px;padding:10px 14px;margin:8px 0;white-space:pre-line}.bub.u{background:var(--a);color:var(--ab);margin-left:15%}
.bar{height:6px;border-radius:4px;background:var(--l);overflow:hidden}.bar i{display:block;height:100%;background:var(--a)}
.demo{border:1px dashed var(--m);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
@media(max-width:800px){.app{display:block}aside{width:auto;height:auto;position:sticky;z-index:5;background:var(--bg);display:flex;gap:4px;overflow-x:auto;padding:10px;border:0;border-bottom:1px solid var(--l)}.logo,.sub{display:none}.nv{width:auto;white-space:nowrap}main{padding:16px}}
</style></head><body>
<div class="app"><aside><div class="logo">KLEIN</div><div class="sub">Property Operations & Finance</div><div id="nav" style="display:contents"></div></aside><main id="main"></main></div>
<div id="mo" onclick="if(event.target==this)cm()"><div class="md" id="md"></div></div><div id="ts"></div>
<script>
const $=s=>document.querySelector(s);
const P=[{id:1,n:'Harbour View Apartment',loc:'Sydney, NSW',m:'Mia',rev:6840},{id:2,n:'Bondi Coastal House',loc:'Sydney, NSW',m:'Mia',rev:9120},{id:3,n:'Melbourne Central Loft',loc:'Melbourne, VIC',m:'Jon',rev:5460},{id:4,n:'Gold Coast Retreat',loc:'Gold Coast, QLD',m:'Jon',rev:7280}];
let U=100;
const D={role:'admin',page:'overview',arg:null,q:'',ds:0,rep:null,tab:'All',
res:[{id:1,g:'Olivia Grant',p:1,i:'28 Sep',o:'1 Oct',src:'Airbnb',st:'Checked In'},{id:2,g:'Liam Chen',p:2,i:'1 Oct',o:'5 Oct',src:'Vrbo',st:'Confirmed'},{id:3,g:'Noah Smith',p:3,i:'28 Sep',o:'1 Oct',src:'Direct',st:'Checked In'},{id:4,g:'Ava Patel',p:4,i:'3 Oct',o:'7 Oct',src:'Airbnb',st:'Confirmed'},{id:5,g:'Emma Wilson',p:1,i:'2 Oct',o:'6 Oct',src:'Airbnb',st:'Confirmed'}],
cl:[{id:1,p:3,due:'11:30',c:'Priya',st:'Assigned'},{id:2,p:2,due:'14:00',c:'Dana',st:'Scheduled'},{id:3,p:4,due:'10:00',c:'Priya',st:'Completed'}],
mt:[{id:1,p:2,x:'Leaking bathroom tap',pr:'Urgent',st:'Assigned',cost:0,s:'Sydney Plumbing (James)'}],
tk:[{id:1,t:'Send check-in instructions to Liam Chen',p:2,pr:'High',st:'Open'},{id:2,t:'Restock linen',p:3,pr:'Medium',st:'Open'},{id:3,t:'Renew building insurance',p:4,pr:'Low',st:'Open'}],
iv:[{id:1,no:'INV-1048',s:'CleanCo',p:1,a:180,st:'Overdue'},{id:2,no:'INV-1051',s:'Sydney Plumbing',p:2,a:320,st:'Pending Approval'},{id:3,no:'INV-1052',s:'Brightspark Electrical',p:3,a:210,st:'Paid'}],
ex:[{id:1,p:3,cat:'Maintenance',s:'Brightspark Electrical',d:'Power outlet repair',a:210},{id:2,p:4,cat:'Cleaning',s:'CleanCo',d:'Turnover clean',a:120},{id:3,p:1,cat:'Utilities',s:'Sydney Water',d:'Water bill',a:132}],
tx:[{id:1,dt:'12 Sep',d:'CLEANCO AU',a:180,st:'Suggested',iv:1,sc:95},{id:2,dt:'14 Sep',d:'BUNNINGS',a:94.5,st:'Unmatched'},{id:3,dt:'15 Sep',d:'SYDNEY WATER',a:132,st:'Unmatched'},{id:4,dt:'10 Sep',d:'BRIGHTSPARK ELEC',a:210,st:'Reconciled',iv:3}],
log:[{t:'09:31',m:'Invoice INV-1048 uploaded',p:1},{t:'Yesterday',m:'Maintenance ticket created: Leaking bathroom tap',p:2},{t:'Yesterday',m:'Guest checked out',p:3}]};
const SUP=[['CleanCo','Cleaning'],['Sydney Plumbing','Plumbing'],['Brightspark Electrical','Electrical'],['FreshLinen Co','Laundry']];
const bc=s=>({Urgent:'r',Overdue:'r','Issue Found':'r',Unmatched:'r',High:'w','Pending Approval':'w',Suggested:'w',Open:'w','In Progress':'b',Approved:'b',Assigned:'b',Completed:'g',Paid:'g',Reconciled:'g',Resolved:'g',Closed:'g','Checked In':'g'}[s]||'');
const B=s=>`<span class="bd ${bc(s)}">${s}</span>`;
const $$=n=>'A$'+Number(n).toLocaleString('en-AU',{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2});
const pn=i=>P.find(p=>p.id==i).n;const sum=a=>a.reduce((x,y)=>x+y,0);
const opts=(a,f)=>a.map(x=>`<option value="${x.id??x}">${x.n??x}</option>`).join('');
function ts(m){const e=$('#ts');e.textContent=m;e.className='s';clearTimeout(ts.t);ts.t=setTimeout(()=>e.className='',2600)}
function lg(m,p){D.log.unshift({t:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),m,p})}
function mo(h){$('#md').innerHTML=h;$('#mo').className='s'}function cm(){$('#mo').className=''}
const ALLOW={admin:null,va:null,owner:['overview','reservations','reports','properties']};
function go(p,a){if(ALLOW[D.role]&&!ALLOW[D.role].includes(p)){ts('Permission denied — not available for the Owner role');return}D.page=p;D.arg=a??null;D.q='';cm();render();scrollTo(0,0)}
const NAV=[['overview','Overview'],['properties','Properties'],['reservations','Reservations'],['cleaning','Cleaning'],['maintenance','Maintenance'],['tasks','Tasks'],['suppliers','Suppliers'],['invoices','Invoices'],['expenses','Expenses'],['recon','Reconciliation'],['reports','Reports'],['ask','Ask Klein']];
/* ---- actions ---- */
function checkOut(id){const r=D.res.find(x=>x.id==id);r.st='Checked Out';const c={id:++U,p:r.p,due:'14:00',c:'Priya',st:'Assigned'};D.cl.push(c);D.tk.push({id:++U,t:'Turnover clean — '+pn(r.p),p:r.p,pr:'High',st:'Open'});lg(r.g+' checked out — cleaning task auto-created',r.p);ts('Checked out · cleaning task created automatically');render();return c}
function checkIn(id){const r=D.res.find(x=>x.id==id);r.st='Checked In';lg(r.g+' checked in',r.p);ts('Guest checked in');render()}
function cleanDone(id,issue){const c=D.cl.find(x=>x.id==id);c.st=issue?'Issue Found':'Completed';const t=D.tk.find(x=>x.t=='Turnover clean — '+pn(c.p)&&x.st!='Done');if(t)t.st='Done';lg(issue?'Cleaning: issue found — '+issue:'Cleaning completed',c.p);if(issue){D.mt.push({id:++U,p:c.p,x:issue,pr:'High',st:'Assigned',cost:0,s:'Sydney Plumbing (James)'});lg('Maintenance ticket created: '+issue,c.p)}ts(issue?'Issue reported · maintenance ticket created':'Cleaning completed · '+pn(c.p)+' is Ready');render()}
const FLOW=['Open','Assigned','In Progress','Resolved','Closed'];
function adv(id){const m=D.mt.find(x=>x.id==id);const n=FLOW[Math.min(4,FLOW.indexOf(m.st)+1)];setMt(m,n)}
function setMt(m,n){m.st=n;lg('Ticket "'+m.x+'" → '+n,m.p);if(n=='Closed'&&m.cost>0&&!D.ex.some(e=>e.mt==m.id)){D.ex.push({id:++U,p:m.p,cat:'Maintenance',s:m.s,d:m.x,a:m.cost,mt:m.id});ts('Closed · expense of '+$$(m.cost)+' recorded')}else ts('Ticket → '+n);render()}
function costForm(id){mo(`<h1>Add cost</h1><label>Amount (AUD)</label><input id="f1" inputmode="decimal"><div class="er" id="er"></div><p><button class="btn p" onclick="saveCost(${id})">Save</button> <button class="btn" onclick="cm()">Cancel</button></p>`)}
function saveCost(id){const v=parseFloat($('#f1').value);if(!(v>0)){$('#er').textContent='Enter a valid amount greater than 0';return}D.mt.find(x=>x.id==id).cost=v;cm();ts('Cost added');render()}
function approve(id){const i=D.iv.find(x=>x.id==id);i.st='Approved';if(!D.ex.some(e=>e.iv==id))D.ex.push({id:++U,p:i.p,cat:i.s=='CleanCo'?'Cleaning':'Maintenance',s:i.s,d:i.no,a:i.a,iv:id});lg(i.no+' approved — expense recorded',i.p);ts(i.no+' approved · expense recorded');render()}
function pay(id){const i=D.iv.find(x=>x.id==id);i.st='Paid';lg(i.no+' marked paid',i.p);ts('Marked paid');render()}
function del(kind,id){mo(`<h1>Delete this?</h1><p class="ml">This can't be undone.</p><button class="btn d" onclick="D['${kind}']=D['${kind}'].filter(x=>x.id!=${id});cm();ts('Deleted');render()">Delete</button> <button class="btn" onclick="cm()">Cancel</button>`)}
function match(id){const t=D.tx.find(x=>x.id==id);t.st='Reconciled';const i=D.iv.find(x=>x.id==t.iv);if(i)i.st='Paid';lg('Transaction '+t.d+' reconciled',i?.p);ts('Reconciled · invoice marked Paid');render()}
function toggleTk(id){const t=D.tk.find(x=>x.id==id);t.st=t.st=='Done'?'Open':'Done';if(t.st=='Done')lg('Task done: '+t.t,t.p);ts(t.st=='Done'?'Task completed':'Task reopened');render()}
function bulkDone(){D.tk.forEach(t=>t.st='Done');ts('All tasks completed');render()}
/* ---- forms ---- */
const F=(l,i)=>`<label>${l}</label>${i}`;
function formInvoice(){mo(`<h1>Create invoice</h1>${F('Supplier',`<select id="f1">${SUP.map(s=>`<option>${s[0]}</option>`)}</select>`)}${F('Property',`<select id="f2">${opts(P)}</select>`)}${F('Amount (AUD)','<input id="f3" inputmode="decimal">')}<div class="er" id="er"></div><p><button class="btn p" onclick="saveInv()">Save</button> <button class="btn" onclick="cm()">Cancel</button></p>`)}
function saveInv(){const a=parseFloat($('#f3').value);if(!(a>0)){$('#er').textContent='Enter a valid amount';return}D.iv.push({id:++U,no:'INV-'+(1060+D.iv.length),s:$('#f1').value,p:+$('#f2').value,a,st:'Pending Approval'});lg('Invoice created',+$('#f2').value);cm();ts('Invoice created · pending approval');render()}
function upload(){mo('<h1>Upload invoice</h1><p class="ml">Reading document…</p><div class="bar"><i style="width:30%;transition:width .9s" id="pb"></i></div>');setTimeout(()=>$('#pb').style.width='100%',50);setTimeout(()=>mo(`<h1>Invoice detected</h1><div class="c">Supplier: CleanCo<br>Invoice #: INV-1048b<br>Amount: AUD 180.00<br>Property: Harbour View Apartment<br>Category: Cleaning</div><p><button class="btn p" onclick="D.iv.push({id:++U,no:'INV-1048b',s:'CleanCo',p:1,a:180,st:'Pending Approval'});lg('Invoice INV-1048b uploaded',1);cm();ts('Invoice added');render()">Confirm Details</button> <button class="btn" onclick="cm()">Cancel</button></p>`),1100)}
function formExp(){mo(`<h1>Add expense</h1>${F('Property',`<select id="f1">${opts(P)}</select>`)}${F('Category',`<select id="f2">${['Cleaning','Maintenance','Utilities','Supplies','Insurance','Management','Other'].map(c=>`<option>${c}</option>`)}</select>`)}${F('Description','<input id="f3">')}${F('Amount (AUD)','<input id="f4" inputmode="decimal">')}<div class="er" id="er"></div><p><button class="btn p" onclick="saveEx()">Save</button> <button class="btn" onclick="cm()">Cancel</button></p>`)}
function saveEx(){const a=parseFloat($('#f4').value),d=$('#f3').value.trim();if(!d){$('#er').textContent='Description is required';return}if(!(a>0)){$('#er').textContent='Enter a valid amount';return}D.ex.push({id:++U,p:+$('#f1').value,cat:$('#f2').value,s:'—',d,a});lg('Expense added: '+d,+$('#f1').value);cm();ts('Expense added');render()}
function formTask(){mo(`<h1>New task</h1>${F('Title','<input id="f1">')}${F('Property',`<select id="f2">${opts(P)}</select>`)}${F('Priority',`<select id="f3"><option>Low</option><option>Medium</option><option>High</option></select>`)}<div class="er" id="er"></div><p><button class="btn p" onclick="saveTk()">Save</button> <button class="btn" onclick="cm()">Cancel</button></p>`)}
function saveTk(){const t=$('#f1').value.trim();if(!t){$('#er').textContent='Title is required';return}D.tk.push({id:++U,t,p:+$('#f2').value,pr:$('#f3').value,st:'Open'});cm();ts('Task created');render()}
function formMt(){mo(`<h1>Report issue</h1>${F('Property',`<select id="f1">${opts(P)}</select>`)}${F('Issue','<input id="f2">')}${F('Priority',`<select id="f3"><option>Low</option><option>Medium</option><option>High</option><option>Urgent</option></select>`)}<div class="er" id="er"></div><p><button class="btn p" onclick="saveMt()">Create ticket</button> <button class="btn" onclick="cm()">Cancel</button></p>`)}
function saveMt(){const x=$('#f2').value.trim();if(!x){$('#er').textContent='Describe the issue';return}D.mt.push({id:++U,p:+$('#f1').value,x,pr:$('#f3').value,st:'Open',cost:0,s:'Unassigned'});lg('Maintenance ticket created: '+x,+$('#f1').value);cm();ts('Ticket created');render()}
function formRes(){mo(`<h1>New reservation</h1>${F('Guest','<input id="f1">')}${F('Property',`<select id="f2">${opts(P)}</select>`)}${F('Check-in','<input id="f3" placeholder="e.g. 8 Oct">')}${F('Check-out','<input id="f4" placeholder="e.g. 11 Oct">')}<div class="er" id="er"></div><p><button class="btn p" onclick="saveRes()">Save</button> <button class="btn" onclick="cm()">Cancel</button></p>`)}
function saveRes(){const g=$('#f1').value.trim(),i=$('#f3').value.trim(),o=$('#f4').value.trim();if(!g||!i||!o){$('#er').textContent='Guest and both dates are required';return}D.res.push({id:++U,g,p:+$('#f2').value,i,o,src:'Direct',st:'Confirmed'});lg('New reservation: '+g,+$('#f2').value);cm();ts('Reservation added');render()}
function formProp(){mo(`<h1>Add property</h1>${F('Name','<input id="f1">')}${F('Location','<input id="f2">')}<div class="er" id="er"></div><p><button class="btn p" onclick="const n=$('#f1').value.trim();if(!n){$('#er').textContent='Name is required';return}P.push({id:++U,n,loc:$('#f2').value||'—',m:'Mia',rev:0});cm();ts('Property added');render()">Save</button> <button class="btn" onclick="cm()">Cancel</button></p>`)}
function issueForm(id){mo(`<h1>Report issue</h1>${F('What did you find?','<input id="f1" value="Bathroom tap leaking">')}<p><button class="btn p" onclick="const v=$('#f1').value.trim();if(!v){return}cm();cleanDone(${id},v)">Report & create ticket</button></p>`)}
/* ---- Klein Intelligence ---- */
const chat=[];
function ask(q){q=q||$('#aq').value.trim();if(!q)return;chat.push(['u',q]);const s=q.toLowerCase();let a,acts=[];
const oi=D.iv.filter(i=>i.st=='Overdue'),pi=D.iv.filter(i=>i.st=='Pending Approval'),om=D.mt.filter(m=>!['Resolved','Closed'].includes(m.st)),ut=D.tx.filter(t=>t.st!='Reconciled'&&t.st!='Ignored');
if(/overdue|invoice/.test(s)){a=oi.length?'Overdue invoices:\n'+oi.map(i=>`• ${i.no} ${i.s} — ${$$(i.a)} (${pn(i.p)})`).join('\n'):'No overdue invoices.';acts=[['Review invoices',"go('invoices')"]]}
else if(/maint/.test(s)){a=om.length?om.map(m=>`• ${pn(m.p)}: ${m.x} (${m.pr}, ${m.st})`).join('\n'):'No open maintenance issues.';acts=[['Open maintenance',"go('maintenance')"]]}
else if(/spend|cleaning/.test(s)){a='Cleaning spend so far: '+$$(sum(D.ex.filter(e=>e.cat=='Cleaning').map(e=>e.a)))+'. Total expenses: '+$$(sum(D.ex.map(e=>e.a)))+'.';acts=[['View expenses',"go('expenses')"]]}
else if(/transaction|reconcil/.test(s)){a=ut.length?ut.map(t=>`• ${t.dt} ${t.d} ${$$(t.a)} — ${t.st}`).join('\n'):'Everything is reconciled.';acts=[['View transactions',"go('recon')"]]}
else if(/owner|summary/.test(s)){a=`Owner summary: revenue ${$$(sum(P.map(p=>p.rev)))}, expenses ${$$(sum(D.ex.map(e=>e.a)))}, ${om.length} open maintenance issue(s).`;acts=[['Generate owner report',"go('reports')"]]}
else if(/cleaner|message|draft/.test(s)){a='Draft: "Hi Priya, guest checks out of Harbour View at 11:00 and the next guest arrives 15:00. Please confirm the clean by 13:30. Thanks!"';acts=[['Create task',"formTask()"]]}
else{a=`${om.length} maintenance issue(s), ${oi.length} overdue and ${pi.length} pending invoice(s), ${ut.length} unreconciled transaction(s), ${D.tk.filter(t=>t.st!='Done').length} open task(s).`;acts=[['Review invoices',"go('invoices')"],['Open maintenance',"go('maintenance')"],['Create task',"formTask()"]]}
chat.push(['a',a,acts]);render()}
/* ---- pages ---- */
const pages={
overview(){const o=D.role=='owner';const rev=sum(P.map(p=>p.rev)),ex=sum(D.ex.map(e=>e.a)),out=sum(D.iv.filter(i=>i.st!='Paid').map(i=>i.a)),ur=D.tx.filter(t=>t.st!='Reconciled'&&t.st!='Ignored').length;
const urg=D.mt.filter(m=>!['Resolved','Closed'].includes(m.st));const ov=D.iv.filter(i=>i.st=='Overdue'),pa=D.iv.filter(i=>i.st=='Pending Approval');
const fin=`<h2>Financial snapshot</h2><div class="g"><div class="c"><div class="k">${$$(rev)}</div><div class="ml">Revenue</div></div><div class="c"><div class="k">${$$(ex)}</div><div class="ml">Expenses</div></div>${o?'':`<div class="c"><div class="k">${$$(out)}</div><div class="ml">Outstanding invoices</div></div><div class="c"><div class="k">${ur}</div><div class="ml">Unreconciled</div></div>`}</div>`;
if(o)return`<h1>Welcome back, Owner</h1><p class="ml">Your properties at a glance.</p>${fin}<h2>My properties</h2>${P.map(p=>`<div class="row ck" onclick="go('properties',${p.id})"><div class="f"><b>${p.n}</b><div class="ml">${p.loc}</div></div>${$$(p.rev)}</div>`).join('')}`;
return`<h1>Good morning, Klein</h1><p class="ml">Thursday 1 October</p>
<h2>Today's operations</h2><div class="g">${[['Check-ins',D.res.filter(r=>r.i=='1 Oct').length,'reservations'],['Check-outs',D.res.filter(r=>r.o=='1 Oct'&&r.st!='Checked Out').length,'reservations'],['Cleaning',D.cl.filter(c=>c.st!='Completed').length,'cleaning'],['Maintenance',urg.length,'maintenance'],['Pending invoices',pa.length+ov.length,'invoices'],['Tasks due',D.tk.filter(t=>t.st!='Done').length,'tasks']].map(x=>`<div class="c row ck" style="display:block" onclick="go('${x[2]}')"><div class="k">${x[1]}</div><div class="ml">${x[0]}</div></div>`).join('')}</div>
<h2>Attention required</h2>${urg.map(m=>`<div class="row ck" onclick="go('maintenance')">${B(m.pr.toUpperCase()=='URGENT'?'Urgent':'High')}<div class="f"><b>${pn(m.p)}</b><div class="ml">${m.x} · ${m.st}</div></div></div>`).join('')}${ov.map(i=>`<div class="row ck" onclick="go('invoices')">${B('Overdue')}<div class="f"><b>${pn(i.p)}</b><div class="ml">${i.s} invoice ${i.no}</div></div></div>`).join('')}${pa.map(i=>`<div class="row ck" onclick="go('invoices')">${B('Pending Approval')}<div class="f"><b>${pn(i.p)}</b><div class="ml">${i.no} · ${$$(i.a)} awaiting approval</div></div></div>`).join('')}${ur?`<div class="row ck" onclick="go('recon')">${B('Suggested')}<div class="f"><b>Bank</b><div class="ml">${ur} transaction(s) need reconciliation</div></div></div>`:''}
<h2>Timeline</h2>${[['08:00','Cleaning · Gold Coast Retreat','cleaning'],['09:30','Check-out · Melbourne Central Loft','reservations'],['10:00','Maintenance · Bondi Coastal House','maintenance'],['12:00','Guest arrival · Bondi Coastal House','reservations'],['14:00','Invoice approval','invoices']].map(e=>`<div class="row ck" onclick="go('${e[2]}')"><b>${e[0]}</b><div class="f">${e[1]}</div></div>`).join('')}
${fin}
<h2>Demo workflow</h2><div class="demo"><div class="f"><b>Checkout → clean → repair → invoice → match → report</b><div class="ml">Step ${D.ds} of 7 · ${DEMO[D.ds]?DEMO[D.ds][0]:'Complete — owner report generated'}</div></div><button class="btn p" onclick="demo()">${D.ds>=7?'Done':'Run next step'}</button></div>
<h2>Activity</h2>${D.log.slice(0,6).map(l=>`<div class="row"><span class="ml" style="width:70px">${l.t}</span><div class="f">${l.m}${l.p?` <span class="ml">· ${pn(l.p)}</span>`:''}</div></div>`).join('')}`},
properties(){if(D.arg){const p=P.find(x=>x.id==D.arg),own=D.role=='owner';return`<button class="btn" onclick="go('properties')">← Properties</button><h1 style="margin-top:12px">${p.n}</h1><p class="ml">${p.loc} · Manager ${p.m}</p><h2>Reservations</h2>${D.res.filter(r=>r.p==p.id).map(r=>`<div class="row ck" onclick="go('reservations')"><div class="f">${r.g}<div class="ml">${r.i} → ${r.o}</div></div>${B(r.st)}</div>`).join('')||'<div class="ml">No reservations.</div>'}${own?'':`<h2>Cleaning & maintenance</h2>${D.cl.filter(c=>c.p==p.id).map(c=>`<div class="row">Clean ${c.due} · ${c.c}<div class="f"></div>${B(c.st)}</div>`).join('')}${D.mt.filter(m=>m.p==p.id).map(m=>`<div class="row">${m.x}<div class="f"></div>${B(m.st)}</div>`).join('')}<h2>Invoices & expenses</h2>${D.iv.filter(i=>i.p==p.id).map(i=>`<div class="row">${i.no} · ${i.s}<div class="f"></div>${$$(i.a)} ${B(i.st)}</div>`).join('')}${D.ex.filter(e=>e.p==p.id).map(e=>`<div class="row">${e.d}<div class="f"></div>${$$(e.a)}</div>`).join('')}<h2>Activity</h2>${D.log.filter(l=>l.p==p.id).map(l=>`<div class="row"><span class="ml" style="width:70px">${l.t}</span>${l.m}</div>`).join('')||'<div class="ml">Nothing yet.</div>'}`}`}
return`<h1>Properties</h1><p class="ml">${P.length} properties</p>${D.role=='owner'?'':'<p><button class="btn p" onclick="formProp()">+ Add property</button></p>'}<div class="g2">${P.map(p=>{const nx=D.res.find(r=>r.p==p.id&&r.st=='Confirmed');return`<div class="c row ck" style="display:block" onclick="go('properties',${p.id})"><b>${p.n}</b><div class="ml">${p.loc} · ${p.m}</div><p class="ml">Next: ${nx?nx.g+' · '+nx.i:'No upcoming reservations'}</p></div>`}).join('')}</div>`},
reservations(){return`<h1>Reservations</h1><p>${D.role=='owner'?'':'<button class="btn p" onclick="formRes()">+ New reservation</button>'}</p>${D.res.map(r=>`<div class="row"><div class="f"><b>${r.g}</b><div class="ml">${pn(r.p)} · ${r.i} → ${r.o} · ${r.src}</div></div>${B(r.st)}${D.role=='owner'?'':(r.st=='Confirmed'?`<button class="btn" onclick="checkIn(${r.id})">Check In</button>`:r.st=='Checked In'?`<button class="btn p" onclick="checkOut(${r.id})">Check Out</button>`:'')}</div>`).join('')||'<div class="c">No reservations yet. <button class="btn" onclick="formRes()">Add one</button></div>'}`},
cleaning(){return`<h1>Cleaning</h1><p class="ml">Check-outs create cleaning tasks automatically.</p>${D.cl.map(c=>`<div class="c" style="margin-bottom:8px"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><div class="f" style="flex:1"><b>${pn(c.p)}</b><div class="ml">Due ${c.due} · ${c.c}</div></div>${B(c.st)}</div>${['Completed','Issue Found'].includes(c.st)?'':`<div class="ml" style="margin:8px 0">Checklist: Bedroom · Bathroom · Kitchen · Living room · Linen · Supplies · Final inspection</div><button class="btn" onclick="D.cl.find(x=>x.id==${c.id}).st='In Progress';ts('Cleaning started');render()">Start</button> <button class="btn" onclick="D.cl.find(x=>x.id==${c.id}).c=['Priya','Dana','Sam'][Math.floor(Math.random()*3)];ts('Cleaner reassigned');render()">Assign cleaner</button> <button class="btn" onclick="ts('Photo uploaded (simulated)')">Upload photo</button> <button class="btn d" onclick="issueForm(${c.id})">Report issue</button> <button class="btn p" onclick="cleanDone(${c.id})">Complete Cleaning</button>`}</div>`).join('')||'<div class="c">No cleanings scheduled.</div>'}`},
maintenance(){return`<h1>Maintenance</h1><p><button class="btn p" onclick="formMt()">+ Report issue</button></p>${D.mt.map(m=>`<div class="row"><div class="f"><b>${m.x}</b><div class="ml">${pn(m.p)} · ${m.s} · Cost ${$$(m.cost)}</div></div>${B(m.pr)}${B(m.st)}${m.st=='Closed'?'':`<button class="btn" onclick="costForm(${m.id})">Add cost</button><button class="btn p" onclick="adv(${m.id})">→ ${FLOW[FLOW.indexOf(m.st)+1]}</button>`}</div>`).join('')||'<div class="c">No maintenance issues. 🎉</div>'}`},
tasks(){const t=D.tab=='All'?D.tk:D.tk.filter(x=>D.tab=='Completed'?x.st=='Done':x.st!='Done');return`<h1>Tasks</h1><div class="tabs">${['All','Open','Completed'].map(x=>`<button class="btn ${D.tab==x?'on':''}" onclick="D.tab='${x}';render()">${x}</button>`).join('')}<button class="btn p" onclick="formTask()">+ Task</button><button class="btn" onclick="bulkDone()">Complete all</button></div>${t.map(k=>`<div class="row"><input type="checkbox" ${k.st=='Done'?'checked':''} onchange="toggleTk(${k.id})"><div class="f" style="${k.st=='Done'?'text-decoration:line-through;color:var(--m)':''}">${k.t}<div class="ml">${pn(k.p)}</div></div>${B(k.pr)}<button class="btn d" onclick="del('tk',${k.id})">Delete</button></div>`).join('')||'<div class="c">Nothing here.</div>'}`},
suppliers(){return`<h1>Suppliers</h1><div class="g2">${SUP.map(s=>{const iv=D.iv.filter(i=>i.s==s[0]);return`<div class="c"><b>${s[0]}</b><div class="ml">${s[1]} · ${iv.length} invoice(s)</div><div class="k" style="margin:6px 0">${$$(sum(iv.map(i=>i.a)))}</div><button class="btn" onclick="go('invoices')">View invoices</button></div>`}).join('')}</div>`},
invoices(){const T=['All','Pending Approval','Approved','Paid','Overdue'];const l=D.tab in{All:1,'Pending Approval':1,Approved:1,Paid:1,Overdue:1}&&D.tab!='All'?D.iv.filter(i=>i.st==D.tab):D.iv;return`<h1>Invoices</h1><div class="tabs">${T.map(x=>`<button class="btn ${D.tab==x?'on':''}" onclick="D.tab='${x}';render()">${x}</button>`).join('')}<button class="btn p" onclick="upload()">Upload Invoice</button><button class="btn" onclick="formInvoice()">Create Invoice</button></div>${l.map(i=>`<div class="row"><div class="f"><b>${i.no}</b> · ${i.s}<div class="ml">${pn(i.p)}</div></div><b>${$$(i.a)}</b>${B(i.st)}${['Pending Approval','Overdue'].includes(i.st)?`<button class="btn p" onclick="approve(${i.id})">Approve</button>`:''}${i.st=='Approved'?`<button class="btn" onclick="pay(${i.id})">Mark Paid</button>`:''}<button class="btn d" onclick="del('iv',${i.id})">Delete</button></div>`).join('')||'<div class="c">No invoices in this view. <button class="btn" onclick="upload()">Upload one</button></div>'}`},
expenses(){return`<h1>Expenses</h1><p><button class="btn p" onclick="formExp()">+ Add expense</button> <button class="btn" onclick="ts('Exported expenses.csv (simulated)')">Export</button></p><div class="c" style="margin-bottom:10px"><div class="k">${$$(sum(D.ex.map(e=>e.a)))}</div><div class="ml">Total expenses</div></div>${D.ex.map(e=>`<div class="row"><div class="f"><b>${e.d}</b><div class="ml">${pn(e.p)} · ${e.cat} · ${e.s}</div></div><b>${$$(e.a)}</b><button class="btn d" onclick="del('ex',${e.id})">Delete</button></div>`).join('')||'<div class="c">No expenses yet.</div>'}`},
recon(){const n=D.tx.filter(t=>t.st=='Reconciled').length;return`<h1>Bank reconciliation</h1><p class="ml">${n} of ${D.tx.length} reconciled</p><div class="bar" style="margin-bottom:14px"><i style="width:${n/D.tx.length*100}%"></i></div>${D.tx.map(t=>{const i=D.iv.find(x=>x.id==t.iv);return`<div class="row"><div class="f"><b>${t.d}</b> · ${$$(t.a)}<div class="ml">${t.dt}${t.st=='Suggested'&&i?` · Suggested: ${i.no} ${i.s}, ${pn(i.p)} (${t.sc||97}% match)`:''}</div></div>${B(t.st)}${['Suggested','Unmatched'].includes(t.st)?`<button class="btn p" onclick="${t.iv?`match(${t.id})`:`ts('No invoice to match — create an expense first')`}">Match</button><button class="btn" onclick="D.tx.find(x=>x.id==${t.id}).st='Ignored';render()">Ignore</button>`:''}</div>`}).join('')}`},
reports(){const sel=D.rep?.p||'all';const own=D.role=='owner';const ps=sel=='all'?P:P.filter(p=>p.id==sel);const ids=ps.map(p=>p.id);const rev=sum(ps.map(p=>p.rev)),ex=D.ex.filter(e=>ids.includes(e.p)),et=sum(ex.map(e=>e.a));const cats={};ex.forEach(e=>cats[e.cat]=(cats[e.cat]||0)+e.a);
const rep=D.rep?.on?`<div class="c" style="margin-top:14px"><h1>Owner Report — ${sel=='all'?'All properties':pn(sel)}</h1><p class="ml">October 2026</p><div class="g"><div><div class="k">${$$(rev)}</div><div class="ml">Revenue</div></div><div><div class="k">${$$(et)}</div><div class="ml">Expenses</div></div><div><div class="k">${$$(rev-et)}</div><div class="ml">Net result</div></div></div><h2>Expenses by category</h2>${Object.entries(cats).map(([k,v])=>`<div class="row" style="margin-bottom:4px">${k}<div class="f"></div>${$$(v)}</div>`).join('')}<h2>Maintenance</h2>${D.mt.filter(m=>ids.includes(m.p)).map(m=>`<div class="row">${m.x}<div class="f"></div>${B(m.st)}</div>`).join('')||'<div class="ml">None</div>'}<h2>Reservations</h2><div class="ml">${D.res.filter(r=>ids.includes(r.p)).length} reservations this period</div><p><button class="btn p" onclick="ts('PDF downloaded (simulated)')">Download PDF</button> <button class="btn" onclick="ts('Report sent to owner')">Send to Owner</button> <button class="btn" onclick="genRep()">Regenerate</button></p></div>`:'';
return`<h1>Reports</h1><div class="top"><select id="rp" onchange="D.rep={p:this.value};render()"><option value="all">All properties</option>${P.map(p=>`<option value="${p.id}" ${sel==p.id?'selected':''}>${p.n}</option>`)}</select><button class="btn p" onclick="genRep()">Generate Owner Report</button></div>${own?'':`<h2>Bookkeeping</h2><div class="g"><div class="c"><div class="k">${$$(rev)}</div><div class="ml">Income</div></div><div class="c"><div class="k">${$$(et)}</div><div class="ml">Expenses</div></div><div class="c"><div class="k">${$$(rev-et)}</div><div class="ml">Net operating result</div></div><div class="c"><div class="k">${D.tx.filter(t=>t.st=='Reconciled').length}/${D.tx.length}</div><div class="ml">Reconciled</div></div></div>`}<h2>Expenses by category</h2>${Object.entries(cats).map(([k,v])=>`<div style="margin-bottom:8px"><div style="display:flex"><span class="f" style="flex:1">${k}</span>${$$(v)}</div><div class="bar"><i style="width:${v/et*100}%"></i></div></div>`).join('')||'<div class="ml">No expenses.</div>'}${rep}`},
ask(){return`<h1>Ask Klein</h1><p class="ml">Answers come from your live workspace data.</p><div class="tabs">${['What needs attention today?','Show me overdue invoices.','Which properties have maintenance issues?','How much did we spend on cleaning?','Which transactions are unreconciled?','Draft a message to the cleaner.'].map(q=>`<button class="btn" onclick="ask('${q}')">${q}</button>`).join('')}</div>${chat.map(c=>c[0]=='u'?`<div class="bub u">${c[1]}</div>`:`<div class="bub">${c[1]}<div style="margin-top:8px">${c[2].map(a=>`<button class="btn" onclick="${a[1]}">${a[0]}</button> `).join('')}</div></div>`).join('')}<div class="top" style="margin-top:14px"><input id="aq" placeholder="Ask Klein…" onkeydown="if(event.key=='Enter')ask()"><button class="btn p" onclick="ask()">Ask</button></div>`}};
function genRep(){D.rep={...(D.rep||{}),on:true};ts('Generating report…');setTimeout(()=>{render();ts('Report ready')},500)}
/* ---- demo scenario ---- */
let dc=null;const DEMO=[
['Guest checks out of Harbour View Apartment',()=>{dc=checkOut(1)}],
['Cleaner completes the clean and reports a leaking tap',()=>cleanDone(dc.id,'Bathroom tap leaking')],
['Supplier repairs it (A$145) and sends an invoice',()=>{const m=D.mt.find(x=>x.x=='Bathroom tap leaking'&&x.p==1);m.cost=145;setMt(m,'Resolved');D.iv.push({id:U+1,no:'INV-1060',s:'Sydney Plumbing',p:1,a:145,st:'Pending Approval'});U++;lg('Invoice INV-1060 received',1)}],
['VA approves the invoice — expense is recorded',()=>approve(U)],
['Bank transaction appears with a suggested match',()=>{D.tx.unshift({id:++U,dt:'1 Oct',d:'SYDNEY PLUMBING',a:145,st:'Suggested',iv:U-2,sc:97});lg('Bank transaction SYDNEY PLUMBING A$145 needs reconciliation',1);ts('New bank transaction · match suggested');render()}],
['VA clicks Match — transaction reconciled',()=>match(U)],
['Generate the monthly owner report',()=>{D.rep={p:1};go('reports');genRep()}]];
function demo(){if(D.ds>=7)return;DEMO[D.ds][1]();D.ds++;if(D.page=='overview')render()}
/* ---- shell ---- */
function render(){const nav=D.role=='owner'?NAV.filter(n=>ALLOW.owner.includes(n[0])):NAV;
$('#nav').innerHTML=nav.map(n=>`<button class="nv ${D.page==n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('');
const top=`<div class="top"><input id="sq" placeholder="Search properties, guests, tasks, invoices…" value="${D.q}" oninput="D.q=this.value;render();const e=$('#sq');e.focus();e.setSelectionRange(99,99)"><select onchange="D.role=this.value;D.page='overview';D.arg=null;render();ts('Viewing as '+this.value)">${['admin','va','owner'].map(r=>`<option value="${r}" ${D.role==r?'selected':''}>${r=='va'?'VA':r[0].toUpperCase()+r.slice(1)}</option>`)}</select><button class="btn" onclick="notifs()">🔔 ${D.log.length}</button></div>`;
$('#main').innerHTML=top+(D.q?search():pages[D.page]())}
function search(){const q=D.q.toLowerCase(),m=s=>s.toLowerCase().includes(q);const own=D.role=='owner';const G=[['Properties',P.filter(p=>m(p.n+p.loc)).map(p=>[p.n,'properties',p.id])],['Reservations',D.res.filter(r=>m(r.g)).map(r=>[r.g+' · '+pn(r.p),'reservations'])]];
if(!own)G.push(['Tasks',D.tk.filter(t=>m(t.t)).map(t=>[t.t,'tasks'])],['Invoices',D.iv.filter(i=>m(i.no+i.s)).map(i=>[i.no+' · '+i.s,'invoices'])],['Maintenance',D.mt.filter(x=>m(x.x)).map(x=>[x.x,'maintenance'])],['Expenses',D.ex.filter(e=>m(e.d+e.s)).map(e=>[e.d,'expenses'])]);
const r=G.filter(g=>g[1].length);return r.length?r.map(g=>`<h2>${g[0]}</h2>${g[1].map(x=>`<div class="row ck" onclick="go('${x[1]}',${x[2]||'null'})">${x[0]}</div>`).join('')}`).join(''):`<div class="c">No results for "${D.q}". <button class="btn" onclick="D.q='';render()">Clear search</button></div>`}
function notifs(){mo(`<h1>Notifications</h1>${D.log.slice(0,8).map(l=>`<div class="row"><span class="ml" style="width:64px">${l.t}</span><div class="f">${l.m}</div></div>`).join('')}<p><button class="btn" onclick="cm()">Close</button></p>`)}
render();
</script></body></html>
