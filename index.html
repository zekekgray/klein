V.Tasks=()=>{const l=flt(S.tasks,['t','who']).filter(t=>S.tab=='All'||(S.tab=='Completed'?t.st=='Done':t.st!='Done'&&t.due==S.tab));return`<div class="top"><h1>Tasks</h1><button class="p" onclick="addTask()">Create task</button></div>${bar('Search tasks','<select onchange="S.tab=this.value;R()">'+['All','Today','Overdue','Completed'].map(x=>`<option ${x==S.tab?'selected':''}>${x}</option>`).join('')+'</select>')}${bkbar('<button class=p onclick="bulk(\'c\')">Complete</button><button class=d onclick="bulk(\'d\')">Delete</button>')}<div class="card">${l.map(t=>`<div class="row"><input type="checkbox" aria-label="Select task" style="width:auto" ${S.bk.includes(t.id)?'checked':''} onchange="bk(${t.id})"><label style="display:flex;gap:10px;align-items:center;flex:1"><input type="checkbox" style="width:auto" ${t.st=='Done'?'checked':''} onchange="toggleT(${t.id})"><span style="${t.st=='Done'?'text-decoration:line-through;color:var(--mut)':''}">${t.t}<div class="mut">${P(t.p)} · ${t.who} · ${t.due}</div></span></label><button class="d" onclick="del('tasks',${t.id})">Delete</button></div>`).join('')||'<div class="empty">No tasks here.</div>'}</div>`};

V.Invoices=()=>{const l=flt(S.inv,['no','sup']).filter(i=>S.tab=='All'||(S.tab=='Approval'?i.st=='Pending approval':i.st.startsWith(S.tab)));return`<div class="top"><h1>Invoices</h1><div class="bar"><button onclick="upload()">Upload invoice</button><button class="p" onclick="addInv()">Create invoice</button></div></div><div class="bar">${['All','Pending','Approval','Paid','Overdue'].map(t=>`<button class="${S.tab==t?'p':''}" onclick="S.tab='${t}';R()">${t}</button>`).join('')}</div>${bar('Search invoice or supplier')}${bkbar('<button class=p onclick="bulk(\'a\')">Approve</button><button class=d onclick="bulk(\'r\')">Reject</button>')}${tbl(['Invoice','Supplier','Property','Due','Amount','Status',''],l.map(i=>`<tr><td><input type="checkbox" aria-label="Select invoice" style="width:auto;margin-right:8px" ${S.bk.includes(i.id)?'checked':''} onchange="bk(${i.id})"><b>${i.no}</b></td><td>${i.sup}</td><td>${P(i.p)}</td><td>${i.due}</td><td>${money(i.amt)}</td><td>${tag(i.st)}</td><td style="white-space:nowrap">${/Pending|Overdue/.test(i.st)?`<button class="p" onclick="approve(${i.id})">Approve</button> <button class="d" onclick="rej(${i.id})">Reject</button>`:''}<button class="d" onclick="del('inv',${i.id})">Delete</button></td></tr>`),'No invoices in this view.','<button class=p onclick="addInv()">Create invoice</button>')}`};

V.Reconciliation=()=>`<div class="top"><div><h1>Reconciliation</h1><div class="mut">${cnt.un()} transactions to review</div></div></div>${tbl(['Date','Bank description','Amount','Suggestion','Status',''],S.txn.map(t=>`<tr><td>${t.d}</td><td><b>${t.desc}</b></td><td>${money(t.amt)}</td><td>${t.st=='Reconciled'?'<span class=mut>'+t.m+'</span>':t.m?t.m+(t.st=='Suggested'?' · <b>95% match</b>':''):'No match found'}</td><td>${tag(t.st)}</td><td style="white-space:nowrap">${t.st=='Suggested'?`<button class="p" onclick="match(${t.id})">Match</button> `:''}${t.st!='Reconciled'?`<button onclick="match(${t.id},1)">Ignore</button>`:''}</td></tr>`),'No bank transactions.')}`;
V.Reports=()=>{const o=S.role=='Owner',cats={};S.exp.forEach(e=>cats[e.cat]=(cats[e.cat]||0)+e.amt);const mx=Math.max(1,...Object.values(cats));
return`<div class="top"><h1>Reports</h1><button class="p" onclick="genReport()">Generate owner report</button></div><div class="grid"><div class="card"><div style="font-size:20px;font-weight:600">${money(rev())}</div><span class="mut">Income</span></div><div class="card"><div style="font-size:20px;font-weight:600">${money(exs())}</div><span class="mut">Expenses</span></div><div class="card"><div style="font-size:20px;font-weight:600">${money(rev()-exs())}</div><span class="mut">Net operating result</span></div></div><h2>Expenses by category</h2><div class="card bars">${Object.entries(cats).map(([k,v])=>`<div><span>${k}</span><i style="width:${v/mx*60}%"></i>${money(v)}</div>`).join('')||'<div class="empty">No expenses yet.</div>'}</div>${S.report?`<h2>Owner report</h2><div class="card"><b style="font-size:18px">${S.report.n}</b><div class="mut">October 2026 · Owner statement</div><div class="row"><span>Revenue</span><b>${money(S.report.r)}</b></div><div class="row"><span>Expenses</span><b>${money(S.report.e)}</b></div><div class="row"><span>Net</span><b>${money(S.report.r-S.report.e)}</b></div><div class="row"><span>Reservations</span><b>${S.report.c}</b></div><div class="bar" style="margin:12px 0 0"><button onclick="toast('PDF downloaded (simulated)')">Download PDF</button><button onclick="toast('Sent to owner')">Send to owner</button><button onclick="genReport(1)">Regenerate</button></div></div>`:''}`};
V['Ask Klein']=()=>`<div class="top"><h1>Klein Intelligence</h1></div><div class="bar">${['What needs attention today?','Show overdue invoices','Which properties have maintenance issues?','Which transactions are unreconciled?','How much did we spend on cleaning?'].map(q=>`<button onclick="ask('${q}')">${q}</button>`).join('')}</div><div>${S.chat.map(c=>`<div class="chat ${c.u?'you':''}">${c.m}${c.b?`<div class="bar" style="margin:8px 0 0"><button onclick="go('${c.b}')">Open ${c.b}</button></div>`:''}</div>`).join('')||'<div class="empty">Ask about today’s operations, invoices, maintenance or bank transactions.</div>'}</div><div class="bar"><input id="ai" placeholder="Ask Klein…" onkeydown="if(event.key=='Enter')ask(this.value)"><button class="p" onclick="ask($('#ai').value)">Ask</button></div>`;
const bkbar=a=>S.bk.length?`<div class="card bar" style="align-items:center"><b>${S.bk.length} selected</b>${a}<button onclick="S.bk=[];R(1)">Clear</button></div>`:'';
function bk(i){S.bk=S.bk.includes(i)?S.bk.filter(x=>x!=i):[...S.bk,i];R(1)}
function apv(v){v.st='Approved';S.exp.push({id:id(),d:'1 Oct',p:v.p,cat:v.cat,sup:v.sup,desc:'Invoice '+v.no,amt:v.amt});S.txn.push({id:id(),d:'1 Oct',desc:v.sup.toUpperCase()+' AU',amt:v.amt,st:'Suggested',m:'Invoice '+v.no+' · '+v.sup+' · '+P(v.p),inv:v.id});log(v.p,'Invoice '+v.no+' approved')}
function bulk(a){U();const ids=S.bk;if(S.page=='Tasks'){if(a=='c'){S.tasks.forEach(t=>{if(ids.includes(t.id))t.st='Done'});toast(ids.length+' tasks completed')}else{S.tasks=S.tasks.filter(t=>!ids.includes(t.id));toast(ids.length+' tasks deleted')}}else{const m=S.inv.filter(i=>ids.includes(i.id)&&/Pending|Overdue/.test(i.st));m.forEach(i=>a=='a'?apv(i):i.st='Rejected');toast(m.length?m.length+(a=='a'?' invoices approved':' invoices rejected'):'Nothing to change. Selected invoices are already processed')}S.bk=[];R(1)}

V.Guests=()=>{if(S.sel){const g=S.guests.find(x=>x.id==S.sel);if(!g)return'<div class="card empty">Guest not found.</div>';const rs=S.res.filter(r=>r.g==g.n);return`<button onclick="go('Guests')">← Guests</button><div class="top" style="margin-top:12px"><div><h1>${g.n}</h1><div class="mut">${g.email} · ${g.phone}</div></div><div class="bar"><button onclick="editGuest(${g.id})">Edit</button><button class="p" onclick="addNote(${g.id})">Add note</button></div></div><h2>Reservations</h2>${tbl(['Property','Stay','Status'],rs.map(r=>`<tr class="k" onclick="go('Reservations',${r.id})"><td><b>${P(r.p)}</b></td><td>${r.in} – ${r.out}</td><td>${tag(r.st)}</td></tr>`),'No reservations yet for this guest.')}<h2>Notes</h2><div class="card">${g.notes.map(n=>`<div class="row">${n}</div>`).join('')||'<div class="empty">No notes. Add preferences or special requests.</div>'}</div>`}

function addGuest(){form('Add guest',[{k:'n',l:'Name',r:1},{k:'email',l:'Email',r:1},{k:'phone',l:'Phone'}],v=>{S.guests.push({id:id(),...v,notes:[]});toast('Guest added');R()})}

function addNote(i){form('Add note',[{k:'t',l:'Note',r:1}],v=>{S.guests.find(x=>x.id==i).notes.unshift(v.t);toast('Note added');R()})}
// calendar
const dn=s=>{const m=String(s).match(/(\d+) (\w+)/);return m&&MO.indexOf(m[2])==9?+m[1]:null};
function evs(){const e=[];S.res.forEach(r=>{if(r.st=='Cancelled')return;const a=dn(r.in),b=dn(r.out);if(a)e.push([a,'res','In · '+r.g,'Reservations',r.id]);if(b)e.push([b,'res','Out · '+r.g,'Reservations',r.id])});S.clean.forEach(c=>e.push([1,'cl',c.due+' Clean · '+P(c.p),'Cleaning',c.id]));S.maint.filter(m=>!/Closed|Resolved/.test(m.st)).forEach(m=>e.push([1,'mt',m.t,'Maintenance',0]));S.tasks.filter(t=>t.st!='Done').forEach(t=>e.push([t.due=='Upcoming'?3:1,'tk',t.t,'Tasks',0]));return e}
V.Calendar=()=>{const E=evs(),v=S.cv,d=S.cd,day=x=>E.filter(e=>e[0]==x),chip=e=>`<a class="ev ${e[1]}" tabindex=0 title="${e[2]}" onclick="go('${e[3]}'${e[4]?','+e[4]:''})">${e[2]}</a>`;let body;
if(v=='Month'){let c=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="mut" style="border:0;background:none;min-height:0">${x}</div>`).join('')+'<div style="border:0;background:none"></div>'.repeat(3);for(let x=1;x<=31;x++)c+=`<div><a onclick="S.cd=${x};S.cv='Day';R(1)" style="cursor:pointer;font-weight:${x==1?700:400}">${x}</a>${day(x).map(chip).join('')}</div>`;body=`<div class="cal">${c}</div>`}
else{const n=v=='Day'?1:7;body='<div class="card">'+Array.from({length:n},(_,i)=>d+i).filter(x=>x<=31).map(x=>`<div class="row" style="align-items:flex-start"><b style="width:64px">${x} Oct</b><div style="flex:1">${day(x).map(chip).join('')||'<span class="mut">Nothing scheduled</span>'}</div></div>`).join('')+'</div>'}
return`<div class="top"><h1>Calendar</h1><div class="bar">${['Day','Week','Month'].map(t=>`<button class="${v==t?'p':''}" onclick="S.cv='${t}';R(1)">${t}</button>`).join('')}</div></div>${v!='Month'?`<div class="bar"><button onclick="S.cd=Math.max(1,S.cd-${v=='Day'?1:7});R(1)">Previous</button><button onclick="S.cd=Math.min(31,S.cd+${v=='Day'?1:7});R(1)">Next</button></div>`:'<div class="mut" style="margin-bottom:8px">October 2026. Tap a date for the day view.</div>'}<div class="bar"><span class="ev res">Reservation</span><span class="ev cl">Cleaning</span><span class="ev mt">Maintenance</span><span class="ev tk">Task</span></div>${body}`};

const DC=['Contracts','Invoices','Receipts','Insurance','Property documents','Maintenance documents'];
V.Documents=()=>{const o=S.role=='Owner';let l=flt(S.docs,['n','link']).filter(d=>S.dq=='All'||d.cat==S.dq);if(o)l=l.filter(d=>/Contracts|Insurance|Property/.test(d.cat));return`<div class="top"><h1>Documents</h1>${o?'':`<button class="p" onclick="addDoc()">Upload</button>`}</div>${bar('Search documents','<select onchange="S.dq=this.value;R()">'+['All',...DC].map(x=>`<option ${x==S.dq?'selected':''}>${x}</option>`).join('')+'</select>')}${tbl(['Name','Category','Linked to',''],l.map(d=>`<tr><td><b>${d.n}</b></td><td>${d.cat}</td><td>${d.link}</td><td style="white-space:nowrap"><button onclick="viewDoc(${d.id})">View</button>${o?'':` <button class="d" onclick="del('docs',${d.id})">Delete</button>`}</td></tr>`),'No documents found.',o?'':'<button class=p onclick="addDoc()">Upload document</button>')}`};
function addDoc(){form('Upload document',[{k:'n',l:'File name',r:1},{k:'cat',l:'Category',o:DC},{k:'link',l:'Associate with',o:[...S.props.map(p=>p.n),...S.sups.map(x=>x.n)]}],v=>{S.docs.push({id:id(),...v});toast('Document uploaded (simulated)');R()})}
function viewDoc(i){const d=S.docs.find(x=>x.id==i);modal(`<h2 style="margin-top:0">${d.n}</h2><div class="mut">${d.cat} · ${d.link}</div><div class="card empty" style="margin:14px 0">Preview (simulated)</div><div class="bar" style="justify-content:flex-end;margin:0"><button class="p" onclick="close()">Close</button></div>`)}
// notifications
function notes(){const n=[],a=(c,k,t,sb,pg)=>S.nset[c]!==false&&n.push({k,t,s:sb,pg});S.maint.filter(m=>!/Closed|Resolved/.test(m.st)).forEach(m=>a('maint','m'+m.id,'New maintenance issue: '+m.t,P(m.p),'Maintenance'));S.inv.filter(i=>i.st=='Overdue').forEach(i=>a('invoice','o'+i.id,'Invoice overdue: '+i.no,i.sup+' · '+money(i.amt),'Invoices'));S.inv.filter(i=>i.st=='Pending approval').forEach(i=>a('invoice','a'+i.id,'Invoice awaiting approval: '+i.no,i.sup+' · '+money(i.amt),'Invoices'));S.txn.filter(t=>t.st!='Reconciled').forEach(t=>a('bank','t'+t.id,'Bank transaction needs review: '+t.desc,money(t.amt),'Reconciliation'));S.tasks.filter(t=>t.due=='Overdue'&&t.st!='Done').forEach(t=>a('task','k'+t.id,'Task overdue: '+t.t,P(t.p),'Tasks'));S.res.filter(r=>r.st=='Pending').forEach(r=>a('res','r'+r.id,'New reservation: '+r.g,P(r.p),'Reservations'));S.clean.filter(c=>c.st=='Completed').forEach(c=>a('cleaning','c'+c.id,'Cleaning completed',P(c.p),'Cleaning'));return n}
V.Notifications=()=>{const n=notes();return`<div class="top"><h1>Notifications</h1><button onclick="S.read=notes().map(x=>x.k);R(1);toast('All marked as read')">Mark all read</button></div><div class="card">${n.map(x=>`<div class="row k" tabindex=0 onclick="S.read.push('${x.k}');go('${x.pg}')"><span style="display:flex;gap:10px;align-items:center">${S.read.includes(x.k)?'<i style="width:8px"></i>':'<i class="unr"></i>'}<span>${x.t}<div class="mut">${x.s}</div></span></span><span class="mut">Open</span></div>`).join('')||'<div class="empty">You’re all caught up.</div>'}</div>`};
// settings
V.Settings=()=>{if(S.role!='Admin')return`<div class="top"><h1>Settings</h1></div><div class="card empty">Permission denied. Only Admins can change workspace settings.<div style="margin-top:12px"><button class="p" onclick="S.role='Admin';go('Settings')">Switch to Admin</button></div></div>`;const t=S.sp,w=S.ws;let b='';
if(t=='Workspace')b=`<div class="card"><div class="row"><span>Workspace</span><b>${w.n}</b></div><div class="row"><span>Currency</span><b>${w.cur}</b></div><div class="row"><span>Time zone</span><b>${w.tz}</b></div></div><div class="bar" style="margin-top:12px"><button class="p" onclick="editWs()">Edit workspace</button></div>`;
if(t=='Users')b=`<div class="bar"><button class="p" onclick="inviteU()">Invite user</button></div>`+tbl(['Name','Email','Role',''],S.users.map(u=>`<tr><td><b>${u.n}</b></td><td>${u.email}</td><td>${u.role}</td><td><button class="d" onclick="del('users',${u.id})">Remove</button></td></tr>`),'No users.');
if(t=='Roles')b=tbl(['Role','Operations','Finance','Settings','Owner portal'],[['Admin','Yes','Yes','Yes','Yes'],['Property Manager','Yes','Yes','—','Yes'],['VA','Yes','Yes','—','—'],['Cleaner','Own tasks','—','—','—'],['Maintenance','Own tickets','—','—','—'],['Accountant','—','Yes','—','—'],['Owner','—','Own reports','—','Yes']].map(r=>`<tr>${r.map((c,i)=>i?`<td>${c}</td>`:`<td><b>${c}</b></td>`).join('')}</tr>`));
if(t=='Notifications')b=`<div class="card">${[['cleaning','Cleaning completed'],['maint','New maintenance issue'],['invoice','Invoice awaiting approval or overdue'],['bank','Bank transaction needs review'],['task','Task overdue'],['res','New reservation']].map(([k,l])=>`<label class="row" style="justify-content:flex-start"><input type="checkbox" style="width:auto" ${S.nset[k]!==false?'checked':''} onchange="S.nset['${k}']=this.checked;toast('Preference saved');R(1)"> ${l}</label>`).join('')}</div>`;
if(t=='Categories')b=`<div class="bar"><button class="p" onclick="addCat()">Add category</button></div><div class="card">${S.cats.map((c,i)=>`<div class="row"><span>${c}</span><button class="d" onclick="rmCat(${i})">Remove</button></div>`).join('')}</div>`;
if(t=='Integrations')b=`<div class="card">${['Airbnb','Vrbo','Xero','Bank feed'].map(x=>`<div class="row"><span>${x}<div class="mut">Planned for V3</div></span><button onclick="toast('Integrations arrive in V3')">Connect</button></div>`).join('')}</div>`;
if(t=='Billing')b=`<div class="card"><b>Prototype plan</b><div class="mut">Billing isn’t active in this prototype.</div><div class="bar" style="margin:12px 0 0"><button onclick="toast('Billing arrives with the live product')">Manage billing</button></div></div>`;
return`<div class="top"><h1>Settings</h1></div><div class="bar">${['Workspace','Users','Roles','Notifications','Categories','Integrations','Billing'].map(x=>`<button class="${t==x?'p':''}" onclick="S.sp='${x}';R(1)">${x}</button>`).join('')}</div>${b}`};
function editWs(){form('Edit workspace',[{k:'n',l:'Workspace name',v:S.ws.n,r:1},{k:'cur',l:'Currency',o:['AUD','USD','GBP','CAD','NZD'],v:S.ws.cur},{k:'tz',l:'Time zone',o:['Australia/Sydney','Australia/Melbourne','Australia/Brisbane','Asia/Manila'],v:S.ws.tz}],v=>{Object.assign(S.ws,v);toast('Workspace saved');R()})}
function inviteU(){form('Invite user',[{k:'n',l:'Name',r:1},{k:'email',l:'Email',r:1},{k:'role',l:'Role',o:['Property Manager','VA','Cleaner','Maintenance','Accountant','Owner','Admin']}],v=>{S.users.push({id:id(),...v});toast('Invitation sent to '+v.email);R()})}
function addCat(){form('Add category',[{k:'n',l:'Category name',r:1}],v=>{if(S.cats.includes(v.n))return toast('That category already exists');S.cats.push(v.n);toast('Category added');R()})}
function rmCat(i){U();S.cats.splice(i,1);toast('Category removed');R(1)}
// actions
function R(keep){nav();demoUI();const f=document.activeElement&&document.activeElement.id=='sq',pos=f?$('#sq').selectionStart:0;$('#main').innerHTML=V[S.page]();if(f){const e=$('#sq');e.focus();e.setSelectionRange(pos,pos)}if(!keep)scrollTo(0,0)}
function addProp(){form('Add property',[{k:'n',l:'Name',r:1},{k:'loc',l:'Location',r:1},{k:'mgr',l:'Manager',v:'Maya'}],v=>{S.props.push({id:id(),...v,st:'Ready'});toast('Property added');R()})}
function editProp(i){const p=S.props.find(x=>x.id==i);form('Edit property',[{k:'n',l:'Name',v:p.n,r:1},{k:'loc',l:'Location',v:p.loc,r:1},{k:'mgr',l:'Manager',v:p.mgr}],v=>{Object.assign(p,v);toast('Saved');R()})}
function archive(i){confirmD('Archive this property? Reservations stay on record.','Archive',()=>{U();S.props=S.props.filter(p=>p.id!=i);S.sel=null;toast('Property archived');R()})}
function addRes(){form('Add reservation',[{k:'g',l:'Guest name',r:1},{k:'p',l:'Property',o:po()},{k:'in',l:'Check-in',v:'5 Oct',r:1},{k:'out',l:'Check-out',v:'8 Oct',r:1},{k:'amt',l:'Total (AUD)',n:1,r:1}],v=>{if(!S.guests.some(g=>g.n==v.g))S.guests.push({id:id(),n:v.g,email:v.g.toLowerCase().replace(/ /g,'.')+'@example.com',phone:'0400 000 000',notes:[]});S.res.push({id:id(),...v,p:+v.p,src:'Direct',st:'Confirmed'});log(+v.p,'New reservation: '+v.g);toast('Reservation added');R()})}
function resSt(i,st){U();const r=S.res.find(x=>x.id==i);r.st=st;const p=S.props.find(x=>x.id==r.p);log(r.p,'Guest '+st.toLowerCase()+': '+r.g);if(st=='Checked In')p.st='Occupied';if(st=='Checked Out'){p.st='Needs cleaning';S.clean.push({id:id(),p:r.p,who:'Priya (CleanCo)',due:'14:00',st:'Assigned',issue:''});S.tasks.push({id:id(),t:'Turnover clean: '+p.n,p:r.p,who:'Priya',due:'Today',st:'Open',cl:1});toast('Checked out. Cleaning task created automatically')}else toast('Reservation '+st.toLowerCase());R()}
function newClean(p){S.clean.push({id:id(),p,who:'Unassigned',due:'14:00',st:'Scheduled',issue:''});toast('Cleaning task created');go('Cleaning')}
function doneClean(i){U();const c=S.clean.find(x=>x.id==i);c.st='Completed';c.at=new Date().toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'});S.props.find(p=>p.id==c.p).st='Ready';S.tasks.filter(t=>t.cl&&t.p==c.p).forEach(t=>t.st='Done');log(c.p,'Cleaning completed. Property ready');toast('Cleaning completed. Property is Ready');R()}
function issue(i){form('Report issue',[{k:'t',l:'What did you find?',v:'Bathroom tap leaking',r:1}],v=>{const c=S.clean.find(x=>x.id==i);c.issue=v.t;c.st='Issue Found';S.maint.push({id:id(),p:c.p,t:v.t,pri:'High',st:'Open',sup:'James Plumbing',cost:0});log(c.p,'Maintenance ticket created: '+v.t);toast('Issue reported. Maintenance ticket created');R()})}
function assign(i){form('Assign cleaner',[{k:'w',l:'Cleaner',o:['Priya (CleanCo)','Tom (CleanCo)','Ana (independent)']}],v=>{const c=S.clean.find(x=>x.id==i);c.who=v.w;if(c.st=='Scheduled')c.st='Assigned';toast('Assigned to '+v.w);R()})}
function addMaint(p){form('New maintenance ticket',[{k:'p',l:'Property',o:po(),v:p},{k:'t',l:'Issue',r:1},{k:'pri',l:'Priority',o:['Low','Medium','High','Urgent'],v:'Medium'},{k:'sup',l:'Supplier',o:so(),v:'James Plumbing'}],v=>{S.maint.push({id:id(),...v,p:+v.p,st:'Assigned',cost:0});log(+v.p,'Maintenance ticket created: '+v.t);toast('Ticket created');go('Maintenance')})}
function closeM(i){const m=S.maint.find(x=>x.id==i);form('Close ticket: '+m.t,[{k:'c',l:'Final repair cost (AUD)',n:1,v:m.cost||145}],v=>{U();m.st='Closed';m.cost=v.c;log(m.p,'Maintenance closed: '+m.t+(v.c?' · '+money(v.c):''));if(v.c){S.inv.push({id:id(),no:'INV-'+(1050+S.n),sup:m.sup||'James Plumbing',p:m.p,cat:'Maintenance',amt:v.c,due:'15 Oct',st:'Pending approval'});toast('Closed. Supplier invoice awaiting approval')}else toast('Ticket closed');R()})}
function addTask(){form('Create task',[{k:'t',l:'Title',r:1},{k:'p',l:'Property',o:po()},{k:'who',l:'Assignee',o:['Maya','Jun','Priya']},{k:'due',l:'Due',o:['Today','Upcoming','Overdue']}],v=>{S.tasks.push({id:id(),...v,p:+v.p,st:'Open'});toast('Task created');R()})}
function toggleT(i){U();const t=S.tasks.find(x=>x.id==i);t.st=t.st=='Done'?'Open':'Done';if(t.st=='Done')log(t.p,'Task completed: '+t.t);toast(t.st=='Done'?'Task completed':'Task reopened');R(1)}
function del(k,i){U();S[k]=S[k].filter(x=>x.id!=i);toast('Deleted');R(1)}
function addSup(){form('Add supplier',[{k:'n',l:'Company',r:1},{k:'cat',l:'Category',o:['Cleaning','Maintenance','Laundry','Plumbing','Electrical','General']}],v=>{S.sups.push({id:id(),...v});toast('Supplier added');R()})}
function addInv(s){form('Create invoice',[{k:'sup',l:'Supplier',o:so(),v:s},{k:'p',l:'Property',o:po()},{k:'cat',l:'Category',o:['Cleaning','Maintenance','Utilities','Supplies','Other']},{k:'amt',l:'Amount (AUD)',n:1,r:1},{k:'due',l:'Due date',v:'15 Oct',r:1}],v=>{S.inv.push({id:id(),no:'INV-'+(1050+S.n),...v,p:+v.p,st:'Pending approval'});toast('Invoice created');go('Invoices')})}
function upload(){modal(`<h2 style="margin-top:0">Upload invoice</h2><div class="card empty" id="up">Reading cleanco-1048.pdf…</div><div id="uf"></div>`);setTimeout(()=>{$('#up').innerHTML=`<div style="text-align:left"><b>Invoice detected</b><div class="row"><span>Supplier</span>CleanCo</div><div class="row"><span>Invoice #</span>INV-1049</div><div class="row"><span>Amount</span>AUD 180.00</div><div class="row"><span>Property</span>Harbour View Apartment</div><div class="row"><span>Category</span>Cleaning</div></div>`;$('#uf').innerHTML=`<div class="bar" style="justify-content:flex-end;margin-top:12px"><button onclick="close()">Cancel</button><button class="p" onclick="S.inv.push({id:id(),no:'INV-1049',sup:'CleanCo',p:1,cat:'Cleaning',amt:180,due:'15 Oct',st:'Pending approval'});close();toast('Invoice added for approval');go('Invoices')">Confirm details</button></div>`},900)}
function approve(i){U();const v=S.inv.find(x=>x.id==i);v.st='Approved';S.exp.push({id:id(),d:'1 Oct',p:v.p,cat:v.cat,sup:v.sup,desc:'Invoice '+v.no,amt:v.amt});S.txn.push({id:id(),d:'1 Oct',desc:v.sup.toUpperCase()+' AU',amt:v.amt,st:'Suggested',m:'Invoice '+v.no+' · '+v.sup+' · '+P(v.p),inv:v.id});log(v.p,'Invoice '+v.no+' approved');toast('Approved. Expense recorded. Bank transaction appeared');R(1)}
function rej(i){U();S.inv.find(x=>x.id==i).st='Rejected';toast('Invoice rejected');R(1)}
function addExp(){form('Add expense',[{k:'p',l:'Property',o:po()},{k:'cat',l:'Category',o:S.cats},{k:'sup',l:'Supplier',v:'',r:1},{k:'desc',l:'Description',r:1},{k:'amt',l:'Amount (AUD)',n:1,r:1}],v=>{S.exp.push({id:id(),d:'1 Oct',...v,p:+v.p});toast('Expense added');R()})}
function match(i,ig){U();const t=S.txn.find(x=>x.id==i);if(ig){S.txn=S.txn.filter(x=>x.id!=i);toast('Transaction ignored');R();return}t.st='Reconciled';const v=S.inv.find(x=>x.id==t.inv);if(v)v.st='Paid';toast('Reconciled. '+cnt.un()+' left to review');R()}
function genReport(re){form('Generate owner report',[{k:'p',l:'Property',o:[['all','All properties'],...po()]},{k:'d',l:'Date range',o:['October 2026','September 2026']}],v=>{const a=v.p=='all';S.report={n:a?'All properties':P(v.p),r:S.res.filter(r=>(a||r.p==v.p)&&/Checked|Confirmed/.test(r.st)).reduce((s,r)=>s+r.amt,0),e:S.exp.filter(e=>a||e.p==v.p).reduce((s,e)=>s+e.amt,0),c:S.res.filter(r=>a||r.p==v.p).length};toast('Report generated');R()})}
function ask(q){if(!q.trim())return;S.chat.push({u:1,m:q});const l=q.toLowerCase();let a,b;if(/overdue|invoice/.test(l)){const o=S.inv.filter(i=>/Overdue|Pending/.test(i.st));a=o.length?o.map(i=>`${i.no} · ${i.sup} · ${money(i.amt)} · ${i.st}`).join('\n'):'No invoices need action.';b='Invoices'}else if(/maint/.test(l)){const m=S.maint.filter(x=>!/Closed|Resolved/.test(x.st));a=m.length?m.map(x=>`${P(x.p)}: ${x.t} (${x.pri})`).join('\n'):'No open maintenance issues.';b='Maintenance'}else if(/reconc|transaction/.test(l)){a=cnt.un()+' transactions are unreconciled.';b='Reconciliation'}else if(/clean/.test(l)&&/spend|much/.test(l)){a='Cleaning spend recorded: '+money(S.exp.filter(e=>e.cat=='Cleaning').reduce((s,e)=>s+e.amt,0));b='Expenses'}else{a=`${cnt.mt()} open maintenance issue(s), ${cnt.inv()} invoice(s) to action, ${cnt.un()} transaction(s) to reconcile, ${cnt.cl()} cleaning(s) pending.`;b='Overview'}S.chat.push({m:a,b});R(1)}
function search(){modal(`<input id="gs" placeholder="Search properties, guests, invoices, tasks…" oninput="gres(this.value)"><div id="gr" class="res" style="margin-top:10px;max-height:50vh;overflow:auto"></div>`);gres('')}
function gres(q){q=q.toLowerCase();const o=S.role=='Owner',G=[['Properties',S.props,x=>x.n+' · '+x.loc,1],['Reservations',S.res,x=>x.g+' · '+P(x.p)+' · '+x.in,1],...(o?[]:[['Tasks',S.tasks,x=>x.t],['Maintenance',S.maint,x=>x.t+' · '+P(x.p)],['Invoices',S.inv,x=>x.no+' · '+x.sup],['Expenses',S.exp,x=>x.desc+' · '+x.sup],['Suppliers',S.sups,x=>x.n]])];let h='';G.forEach(([t,a,f,w])=>{const m=a.filter(x=>!q||f(x).toLowerCase().includes(q)).slice(0,q?6:2);if(m.length)h+=`<div class="mut" style="margin:10px 0 2px;font-size:12px">${t}</div>`+m.map(x=>`<a tabindex=0 onclick="close();go('${t}'${w?','+x.id:''})"><span>${f(x)}</span></a>`).join('')});$('#gr').innerHTML=h||'<div class="empty">No results. Try a guest name, invoice number or property.</div>'}
const DS=[['Check out Olivia Hart at Harbour View','Reservations',1,()=>S.res[0].st=='Checked Out'],['Open the new cleaning and report the tap leak','Cleaning',0,()=>S.maint.some(m=>m.p==1&&/tap/i.test(m.t))],['Close the maintenance ticket at AUD 145','Maintenance',0,()=>S.maint.some(m=>m.p==1&&m.st=='Closed')],['Approve the AUD 145 supplier invoice','Invoices',0,()=>S.inv.some(i=>i.p==1&&i.amt==145&&/Approved|Paid/.test(i.st))],['Match the bank transaction','Reconciliation',0,()=>S.txn.some(t=>t.amt==145&&t.st=='Reconciled')],['Generate the owner report','Reports',0,()=>!!S.report]];
const dstep=()=>DS.findIndex(s=>!s[3]());
function demoUI(){const e=$('#demo');if(!S.demo){e.hidden=true;return}const i=dstep();e.hidden=false;e.innerHTML=i<0?`<b>Demo complete</b><div class="mut">The whole flow ran end to end.</div><div class="bar" style="margin:10px 0 0"><button onclick="S.demo=0;R(1)">Done</button></div>`:`<div class="mut">Step ${i+1} of ${DS.length}</div><b>${DS[i][0]}</b><div class="bar" style="margin:10px 0 0"><button class="p" onclick="go('${DS[i][1]}'${DS[i][2]?',1':''})">Go there</button><button onclick="S.demo=0;R(1)">Stop</button></div>`}
function demo(){S.demo=1;const i=dstep();if(i>=0)go(DS[i][1],DS[i][2]?1:null);else R()}
R();
</script></body></html>
